[project]
name = "demo-uv-fastapi"
version = "0.1.0"
description = "Demo: FastAPI + Pydantic v1 + urllib3 v1 service that breaks on upgrade"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.95.2",
    "pydantic==1.10.13",
    "urllib3==1.26.18",
    "starlette==0.27.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "httpx==0.24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
